# Live demo on GitHub Pages: the procedural (firmware-free) single-file build, rebuilt on every push to main.
#   https://<user>.github.io/<repository>/                  the main build
#   https://<user>.github.io/<repository>/experimental.html  the experimental build
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the demo pages
        run: |
          node app/tools/build_wallpaper.mjs --assets=procedural
          node app/tools/build_wallpaper.mjs --assets=procedural --experimental
          mkdir site
          cp dist/PS3-XMB-procedural.html site/index.html
          cp dist/PS3-XMB-procedural-experimental.html site/experimental.html
          # nothing from the firmware may be published (embedded files are keyed by path)
          if grep -lE '"/(extracted_lines|assets)/' site/*.html; then echo 'firmware files embedded'; exit 1; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
