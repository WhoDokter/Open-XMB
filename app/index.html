<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XMB Ribbon</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #err { position: fixed; left: 12px; bottom: 12px; color: #ff7b7b; font: 12px/1.4 monospace; white-space: pre-wrap; z-index: 20; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="err"></div>
  <script type="module">
    import { start } from './src/main.js';

    const errEl = document.getElementById('err');
    start(document.getElementById('c'))
      .then((app) => { window.__xmb = app; })
      .catch((e) => { console.error(e); errEl.textContent = String((e && e.message) || e); });
  </script>
</body>
</html>
